apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: deploy-to-kubernetes
  title: Deploy Service to Kubernetes
  description: Opens a pull request with Kubernetes manifests for a service that is already registered in the catalog.
  tags:
    - github
    - kubernetes
    - gitops
spec:
  owner: group:default/admins
  type: service

  parameters:
    - title: Service
      required:
        - entity
        - port
      properties:
        entity:
          title: Service
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              - kind: Component
            defaultKind: Component
            allowArbitraryValues: false
          description: "Service already registered in the catalog. To add a new one, use the Register Existing Service template first."
          ui:autofocus: true
        port:
          title: Container Port
          type: integer
          default: 8080

    - title: Kubernetes
      required:
        - imageRepository
        - namespace
      properties:
        imageRepository:
          title: Image Repository
          type: string
          description: "Full image path, e.g. ghcr.io/org/sample-app"
        imageTag:
          title: Image Tag
          type: string
          description: "Docker image tag, e.g. latest or v1.0.0"
          default: "latest"
        namespace:
          title: Namespace
          type: string
          description: "Kubernetes namespace to deploy into"
          default: "default"
        replicas:
          title: Replicas
          type: integer
          default: 1
        imagePullSecret:
          title: Image Pull Secret
          type: string
          description: "Name of the k8s secret for private registry (leave empty if not needed)"
          default: ""
        cpuRequest:
          title: CPU Request
          type: string
          default: "50m"
        memoryRequest:
          title: Memory Request
          type: string
          default: "64Mi"
        memoryLimit:
          title: Memory Limit
          type: string
          default: "128Mi"

  steps:
    - id: entity
      name: Load service from catalog
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.entity }}

    - id: fetch
      name: Render templates
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ steps['entity'].output.entity.metadata.name }}
          description: ${{ steps['entity'].output.entity.metadata.description }}
          owner: ${{ steps['entity'].output.entity.spec.owner }}
          type: ${{ steps['entity'].output.entity.spec.type }}
          lifecycle: ${{ steps['entity'].output.entity.spec.lifecycle }}
          techdocsRef: ${{ steps['entity'].output.entity.metadata.annotations['backstage.io/techdocs-ref'] }}
          repoSlug: ${{ (steps['entity'].output.entity.metadata.annotations['backstage.io/source-location'] | replace('url:https://github.com/', '')).split('/')[0] }}/${{ (steps['entity'].output.entity.metadata.annotations['backstage.io/source-location'] | replace('url:https://github.com/', '')).split('/')[1] }}
          port: ${{ parameters.port }}
          imageRepository: ${{ parameters.imageRepository }}
          imageTag: ${{ parameters.imageTag }}
          namespace: ${{ parameters.namespace }}
          replicas: ${{ parameters.replicas }}
          imagePullSecret: ${{ parameters.imagePullSecret }}
          cpuRequest: ${{ parameters.cpuRequest }}
          memoryRequest: ${{ parameters.memoryRequest }}
          memoryLimit: ${{ parameters.memoryLimit }}

    - id: pr
      name: Open pull request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ (steps['entity'].output.entity.metadata.annotations['backstage.io/source-location'] | replace('url:https://github.com/', '')).split('/')[0] }}&repo=${{ (steps['entity'].output.entity.metadata.annotations['backstage.io/source-location'] | replace('url:https://github.com/', '')).split('/')[1] }}
        branchName: backstage/deploy-to-kubernetes
        title: "chore: add k8s manifests and update catalog-info"
        description: "Adds Kubernetes manifests under k8s/ and rewrites catalog-info.yaml with Kubernetes annotations. Review the catalog-info.yaml diff: anything not carried over (extra entities, tags, links) must be restored by hand."
        commitMessage: "chore: add k8s manifests and update catalog-info"

  output:
    links:
      - title: Pull Request
        icon: github
        url: ${{ steps['pr'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ parameters.entity }}
